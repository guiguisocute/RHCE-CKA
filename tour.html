<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RHCE 与 CKA 考试导览</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 讲台式分步讲解——左边是画在方格白板上的动画图解，右边是讲解稿，底部固定一条播放控制栏；三条考试轨道沿用学习路线页的颜色。 */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --stage: #fbfcfd;
  --grid: #e7ebf1;
  --ink: #17202b;
  --muted: #5b6676;
  --line: #d6dce5;
  --base: #55657a;
  --rhcsa: #b8322b;
  --rhce: #a86400;
  --cka: #2c5bc6;
  --ok: #1d7a46;
  --bad: #c0392b;
  --accent: #0d7468;
  --accent-ink: #ffffff;
  --term-bg: #1d2530;
  --term-ink: #dfe6ee;
  --term-dim: #8b98a8;
  --term-ok: #7bd88f;
  --term-warn: #f0c060;
  --font-display: "IBM Plex Sans Condensed", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --stage: #131a22; --grid: #1e2732; --ink: #e5eaf1; --muted: #9aa5b4; --line: #2a3340;
    --base: #9eb0c6; --rhcsa: #ff7a70; --rhce: #f2a640; --cka: #85a8ff; --ok: #5fd08a; --bad: #ff7a70;
    --accent: #3cc4b3; --accent-ink: #062521; --term-bg: #0b1016; --term-ink: #dfe6ee; --term-dim: #7f8c9c; --term-ok: #7bd88f; --term-warn: #f0c060;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --stage: #131a22; --grid: #1e2732; --ink: #e5eaf1; --muted: #9aa5b4; --line: #2a3340;
  --base: #9eb0c6; --rhcsa: #ff7a70; --rhce: #f2a640; --cka: #85a8ff; --ok: #5fd08a; --bad: #ff7a70;
  --accent: #3cc4b3; --accent-ink: #062521; --term-bg: #0b1016; --term-ink: #dfe6ee; --term-dim: #7f8c9c; --term-ok: #7bd88f; --term-warn: #f0c060;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .88em; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.t-base { --t: var(--base); } .t-rhcsa { --t: var(--rhcsa); } .t-rhce { --t: var(--rhce); } .t-cka { --t: var(--cka); }
.t-ok { --t: var(--ok); } .t-bad { --t: var(--bad); } .t-mute { --t: var(--muted); }

header .wrap { padding-block: 22px 12px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: end; justify-content: space-between; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header h1 { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700; }
header .hint { color: var(--muted); font-size: 13px; }

/* 章节导轨 */
.rail { display: flex; gap: 6px; padding-block: 8px 14px; overflow-x: auto; scrollbar-width: none; }
.chap { display: grid; gap: 4px; min-width: 0; flex: var(--n) 1 0; }
.chap-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chap.on .chap-name { color: var(--t); }
.ticks { display: flex; gap: 3px; }
.tick { all: unset; box-sizing: border-box; cursor: pointer; flex: 1 1 0; height: 8px; min-width: 10px; border-radius: 2px; background: color-mix(in srgb, var(--t) 22%, var(--surface)); }
.tick.seen { background: color-mix(in srgb, var(--t) 55%, var(--surface)); }
.tick.cur { background: var(--t); box-shadow: 0 0 0 2px color-mix(in srgb, var(--t) 30%, transparent); }
.tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 主体 */
.deck { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: start; padding-bottom: 24px; }
.stage {
  margin: 0; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  background-color: var(--stage);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px;
}
.stage-wrap { min-width: 0; display: grid; gap: 6px; }
.zoom-bar { display: none; align-items: center; justify-content: flex-end; gap: 8px; font-size: 12px; color: var(--muted); }
.stage.zoom { overflow-x: auto; }
.stage.zoom .sv { width: 600px; max-width: none; }
.talk { min-width: 0; display: grid; gap: 12px; align-content: start; }
.talk-meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.talk-meta .chip-ch { color: var(--t); font-weight: 500; }
.talk h2 { font-size: clamp(1.25rem, 2.4vw, 1.6rem); font-weight: 700; color: var(--ink); }
.say { display: grid; gap: 10px; max-width: 62ch; }
.say p.speaking { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: -8px 0 0 color-mix(in srgb, var(--accent) 10%, transparent), 8px 0 0 color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 2px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.refs span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; }

/* 控制栏 */
.controls { position: sticky; bottom: 0; z-index: 4; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.btn { font: inherit; font-size: 14px; cursor: pointer; border-radius: 6px; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.counter { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.tts-note { font-size: 12px; color: var(--muted); }

/* SVG 场景 */
.sv { display: block; width: 100%; height: auto; font-family: var(--font-body); }
.bx { fill: var(--surface); stroke: var(--t); stroke-width: 2; }
.bx.solid { fill: var(--t); }
.bx.dash { stroke-dasharray: 7 5; }
.frame { fill: color-mix(in srgb, var(--t) 5%, transparent); stroke: var(--t); stroke-width: 1.5; stroke-dasharray: 6 5; }
.lb { fill: var(--ink); font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.lb.mono { font-family: var(--font-mono); font-weight: 500; }
.sb { fill: var(--muted); font-family: var(--font-mono); font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.bx.solid ~ .lb, .bx.solid ~ .sb { fill: var(--surface); }
.ln { stroke: var(--t); stroke-width: 2.5; fill: none; }
.ln.dash { stroke-dasharray: 7 6; }
.ah { fill: var(--t); }
.al { fill: var(--t); font-family: var(--font-mono); font-size: 15px; dominant-baseline: central; }
.tx { fill: var(--ink); dominant-baseline: central; }
.tx.mono { font-family: var(--font-mono); }
.tx.muted { fill: var(--muted); }
.tx.tcol { fill: var(--t); }
.tx.bold { font-weight: 700; font-family: var(--font-display); }
.nc { fill: var(--t); }
.nt { fill: var(--surface); font-family: var(--font-mono); font-size: 15px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.panel { fill: var(--term-bg); }
.ptx { fill: var(--term-ink); font-family: var(--font-mono); font-size: 16px; dominant-baseline: central; }
.ptx.dim { fill: var(--term-dim); }
.ptx.warn { fill: var(--term-warn); }
.tok { fill: var(--t); stroke: var(--surface); stroke-width: 2; }
.strike { stroke: var(--bad); stroke-width: 2.5; }

/* HTML 场景 */
.hs { padding: 18px; display: grid; gap: 14px; }
.hs h3 { margin: 0; font-family: var(--font-display); font-size: 15px; color: var(--muted); font-weight: 600; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card.tl { border-left: 4px solid var(--t); }
.code, .term pre { margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre; }
.code { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.code .k { color: var(--rhce); }
.code .s { color: var(--cka); }
.code .c { color: var(--muted); }
.code .h { color: var(--rhcsa); font-weight: 500; }
.code .ln, .term .tl { display: block; }
.term { background: var(--term-bg); color: var(--term-ink); border-radius: 8px; overflow: hidden; min-width: 0; }
.term-bar { display: flex; gap: 6px; align-items: center; padding: 7px 12px; font-family: var(--font-mono); font-size: 11px; color: var(--term-dim); border-bottom: 1px solid color-mix(in srgb, var(--term-ink) 12%, transparent); }
.term-bar i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--term-ink) 25%, transparent); display: inline-block; }
.term pre { padding: 12px 14px; }
.term .pr { color: var(--term-ok); }
.term .o { color: var(--term-ink); }
.term .d { color: var(--term-dim); }
.term .g { color: var(--term-ok); }
.term .y { color: var(--term-warn); }
.type { display: inline-block; vertical-align: bottom; }
.grid10 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dom { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--t); border-radius: 6px; padding: 8px 12px; min-width: 0; }
.dom b { font-family: var(--font-display); font-size: 15px; }
.dom span { font-size: 12.5px; color: var(--muted); }
.dom.hot { border-color: var(--t); background: color-mix(in srgb, var(--t) 7%, var(--surface)); }
.dom .flag { font-family: var(--font-mono); font-size: 11px; color: var(--t); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--t); border-radius: 6px; padding: 8px 12px; font-size: 13px; min-width: 0; }
.fact b { display: block; font-family: var(--font-display); color: var(--t); font-size: 15px; }
.fact div { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tasklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
.tasklist li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.tasklist .box { width: 16px; height: 16px; border: 2px solid var(--rhcsa); border-radius: 3px; margin-top: 4px; display: grid; place-items: center; color: var(--surface); font-size: 11px; line-height: 1; }
.tasklist .box.chk { background: var(--ok); border-color: var(--ok); }
.map { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.map th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 6px 10px; border-bottom: 2px solid var(--line); }
.map td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.map td:first-child { color: var(--ink); }
.map td.arrow { color: var(--muted); width: 1.5em; padding-inline: 0; text-align: center; }
.map code { color: var(--t); }
.map-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.runbook { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.runbook ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 13px; }
.runbook code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--cka); font-size: 12px; }
.tree { display: grid; gap: 10px; }
.tree-root { justify-self: start; font-family: var(--font-mono); font-size: 13px; background: var(--cka); color: var(--surface); padding: 6px 12px; border-radius: 6px; }
.branches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.br { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--t); border-radius: 6px; padding: 8px 12px; display: grid; gap: 3px; min-width: 0; }
.br b { font-family: var(--font-mono); font-size: 13.5px; color: var(--t); }
.br span { font-size: 13px; }
.br code { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.weight { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.weight .wb { flex: 1 1 auto; display: flex; height: 14px; border-radius: 3px; overflow: hidden; }
.weight .wb i { display: block; height: 100%; }

/* 动画 */
.pop { animation: pop .5s cubic-bezier(.2, .7, .2, 1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
.fade { animation: fade .5s ease both; animation-delay: var(--d, 0s); }
.draw { animation: fade .15s both; animation-delay: var(--d, 0s); }
.draw .ln { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw .7s ease-out both; animation-delay: var(--d, 0s); }
.draw .al { animation: fade .4s both; animation-delay: calc(var(--d, 0s) + .35s); }
.dim { animation: pop .5s cubic-bezier(.2, .7, .2, 1) both, dim .6s ease forwards; animation-delay: var(--d, 0s), var(--d2, 9s); }
.type { animation: typing calc(var(--n) * 30ms) steps(var(--n)) both; animation-delay: var(--d, 0s); }
.check { animation: checkin .3s ease both; animation-delay: var(--d, 0s); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dim { to { opacity: .22; } }
@keyframes typing { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes checkin { from { background: transparent; border-color: var(--rhcsa); color: transparent; } to { background: var(--ok); border-color: var(--ok); color: var(--surface); } }
@media (prefers-reduced-motion: reduce) {
  .pop, .fade, .draw, .draw .ln, .draw .al, .dim, .type, .check { animation: none !important; }
  .draw .ln { stroke-dasharray: none; }
  .ln.dash { stroke-dasharray: 7 6; }
  .dim { opacity: .22; }
  .check { background: var(--ok); border-color: var(--ok); }
  .tok { display: none; }
}

@media (max-width: 900px) {
  .deck { grid-template-columns: 1fr; gap: 14px; }
}
@media (max-width: 560px) {
  .zoom-bar { display: flex; }
  .btn { padding: 6px 10px; font-size: 13px; }
  .btn.small { padding: 3px 10px; font-size: 12px; }
  .counter { display: none; }
  .cols2, .runbook, .branches, .facts { grid-template-columns: 1fr; }
  .grid10 { grid-template-columns: 1fr; }
  .hs { padding: 12px; }
  .counter { margin-left: 0; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div style="display: grid; gap: 4px;">
      <span class="eyebrow">考试导览 · 25 步 · 约 15 分钟</span>
      <h1>RHCE 与 CKA 考试导览</h1>
      <p class="hint">点「下一步」或按键盘 → 前进；打开「朗读」可以听讲解，打开「连播」会自动讲下去。</p>
    </div>
    <a data-path="index.html" style="font-size: 13px;">打开 24 周学习路线 →</a>
  </div>
  <div class="wrap"><nav class="rail" id="rail" aria-label="章节"></nav></div>
</header>

<main>
  <div class="wrap deck">
    <div class="stage-wrap">
      <div class="zoom-bar"><span>图解字太小？</span><button type="button" class="btn small" id="zoom" aria-pressed="false">放大图解</button></div>
      <figure class="stage" id="stage"></figure>
    </div>
    <article class="talk" id="talk">
      <div class="talk-meta"><span class="chip-ch" id="chap"></span><span id="pos"></span></div>
      <h2 id="title"></h2>
      <div class="say" id="say"></div>
      <div class="refs" id="refs"></div>
    </article>
  </div>
</main>

<div class="controls">
  <div class="wrap">
    <button type="button" class="btn" id="prev">← 上一步</button>
    <button type="button" class="btn primary" id="next">下一步 →</button>
    <button type="button" class="btn" id="tts" aria-pressed="false">朗读</button>
    <button type="button" class="btn" id="auto" aria-pressed="false">连播</button>
    <button type="button" class="btn" id="replay">重播</button>
    <span class="tts-note" id="tts-note" hidden>这个浏览器不支持语音朗读，可以只看文字</span>
    <span class="counter" id="counter"></span>
  </div>
</div>

<script>
(function () {
  "use strict";
  var GH = "https://github.com/guiguisocute/RHCE-CKA/blob/main/";
  var LOCAL = location.protocol === "file:";
  function href(p) { return LOCAL ? p : GH + p; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  /* ---------- SVG 绘图小工具 ---------- */
  var TRACK_IDS = ["base", "rhcsa", "rhce", "cka", "ok", "bad", "mute"];
  var DEFS = "<defs>" + TRACK_IDS.map(function (t) {
    return '<marker id="ah-' + t + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah t-' + t + '" d="M0,0 L10,5 L0,10 z"/></marker>';
  }).join("") + "</defs>";
  function svg(h, inner, label, w) {
    return '<svg class="sv" viewBox="0 0 ' + (w || 720) + " " + h + '" role="img" aria-label="' + esc(label) + '">' + DEFS + inner + "</svg>";
  }
  function box(x, y, w, h, label, o) {
    o = o || {};
    var fs = o.fs || 22, cx = x + w / 2, cy = y + h / 2;
    var ly = o.sub ? cy - fs * 0.45 : cy;
    var st = "--d:" + (o.d || 0) + "s" + (o.d2 != null ? ";--d2:" + o.d2 + "s" : "");
    return '<g class="' + (o.d2 != null ? "dim" : "pop") + " t-" + (o.t || "base") + '" style="' + st + '">' +
      '<rect class="bx' + (o.solid ? " solid" : "") + (o.dash ? " dash" : "") + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8"/>' +
      '<text class="lb' + (o.mono ? " mono" : "") + '" x="' + cx + '" y="' + ly + '" style="font-size:' + fs + 'px">' + esc(label) + "</text>" +
      (o.sub ? '<text class="sb" x="' + cx + '" y="' + (cy + fs * 0.62) + '"' + (o.sfs ? ' style="font-size:' + o.sfs + 'px"' : "") + ">" + esc(o.sub) + "</text>" : "") +
      "</g>";
  }
  function frame(x, y, w, h, o) {
    o = o || {};
    return '<g class="fade t-' + (o.t || "base") + '" style="--d:' + (o.d || 0) + 's"><rect class="frame" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10"/>' +
      (o.label ? '<text class="tx tcol bold" x="' + (o.right ? x + w - 14 : x + 14) + '" y="' + (y + 22) + '" text-anchor="' + (o.right ? "end" : "start") + '" style="font-size:16px">' + esc(o.label) + "</text>" : "") + "</g>";
  }
  function arrow(x1, y1, x2, y2, o) {
    o = o || {};

      scene: function () {
        var x0 = 20, u = 680 / 24;
        var seg = [[0, 2, "base", "准备"], [2, 10, "rhcsa", "RHCSA 8 周"], [10, 16, "rhce", "RHCE 6 周"], [16, 24, "cka", "CKA 8 周"]];
        var s = "";
        seg.forEach(function (g, i) {
          var x = x0 + g[0] * u, w = (g[1] - g[0]) * u;
          s += '<g class="pop t-' + g[2] + '" style="--d:' + (0.2 + i * 0.4) + 's"><rect class="bx solid" x="' + (x + 1) + '" y="120" width="' + (w - 2) + '" height="50" rx="4"/>' +
            (i ? '<text class="lb" x="' + (x + w / 2) + '" y="145" style="font-size:18px;fill:var(--surface)">' + g[3] + "</text>" : "") + "</g>";
        });
        s += txt(x0 + u, 192, "准备 2 周", { cls: "muted", fs: 14, d: 0.3 });
        [[10, "rhcsa", "EX200"], [16, "rhce", "EX294"], [24, "cka", "CKA"]].forEach(function (e, i) {
          var x = x0 + e[0] * u;
          s += '<g class="pop t-' + e[1] + '" style="--d:' + (2.0 + i * 0.3) + 's"><rect class="bx solid" x="' + (x - 8) + '" y="96" width="16" height="16" transform="rotate(45 ' + x + ' 104)"/></g>';
          s += txt(i === 2 ? x - 4 : x, 76, e[2] + " · 第 " + e[0] + " 周", { cls: "bold tcol", t: e[1], fs: 15, anchor: i === 2 ? "end" : "middle", d: 2.1 + i * 0.3 });
        });
        [0, 2, 10, 16, 24].forEach(function (w) { if (w !== 2) s += txt(x0 + w * u, 192, String(w), { cls: "mono muted", fs: 13, d: 1.8, anchor: w === 0 ? "start" : w === 24 ? "end" : "middle" }); });
        [["15 min", "复习错题"], ["40 min", "读一个知识点"], ["35 min", "虚拟机里动手"]].forEach(function (r, i) {
          s += box(20 + i * 235, 250, 210, 90, r[0], { t: "base", sub: r[1], mono: true, fs: 24, d: 3.0 + i * 0.3 });
        });
        s += txt(360, 232, "每天 90 分钟", { cls: "bold muted", fs: 16, d: 2.9 });
        s += txt(360, 420, "下一步：打开学习路线，从第 1 周开始", { cls: "bold", fs: 22, d: 4.2 });
        s += txt(360, 455, "申请免费的红帽开发者订阅，装好两台 RHEL 10 虚拟机", { cls: "muted", fs: 16, d: 4.5 });
        return svg(520, s, "24 周时间轴：准备 2 周、RHCSA 8 周、RHCE 6 周、CKA 8 周，以及每天 90 分钟的节奏");
      } }
  ];

  /* ---------- 状态与渲染 ---------- */
  var stage = document.getElementById("stage"), elTitle = document.getElementById("title"), elSay = document.getElementById("say"),
      elRefs = document.getElementById("refs"), elChap = document.getElementById("chap"), elPos = document.getElementById("pos"),
      elCounter = document.getElementById("counter"), btnPrev = document.getElementById("prev"), btnNext = document.getElementById("next"),
      btnTts = document.getElementById("tts"), btnAuto = document.getElementById("auto"), btnReplay = document.getElementById("replay"),
      talk = document.getElementById("talk"), rail = document.getElementById("rail");
  var cur = 0, seen = {}, ttsOn = false, autoOn = false, timer = null, speakToken = 0;

  function chapterOf(i) { for (var k = 0; k < CHAPTERS.length; k++) if (CHAPTERS[k].id === STEPS[i].ch) return CHAPTERS[k]; }

  /* 章节导轨 */
  var tickEls = [];
  CHAPTERS.forEach(function (c) {
    var idx = []; STEPS.forEach(function (s, i) { if (s.ch === c.id) idx.push(i); });
    var wrap = document.createElement("div");
    wrap.className = "chap t-" + c.t; wrap.style.setProperty("--n", idx.length); wrap.dataset.ch = c.id;
    wrap.innerHTML = '<span class="chap-name">' + esc(c.name) + '</span><span class="ticks"></span>';
    var ticks = wrap.querySelector(".ticks");
    idx.forEach(function (i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tick"; b.setAttribute("aria-label", "第 " + (i + 1) + " 步：" + STEPS[i].title); b.title = STEPS[i].title;
      b.addEventListener("click", function () { go(i); });
      ticks.appendChild(b); tickEls[i] = b;
    });
    rail.appendChild(wrap);
  });

  function render(i) {
    var s = STEPS[i], c = chapterOf(i);
    stage.innerHTML = s.scene();
    talk.className = "talk t-" + c.t;
    var inCh = STEPS.filter(function (x) { return x.ch === s.ch; }), pos = inCh.indexOf(s) + 1;
    elChap.textContent = c.name;
    elPos.textContent = "本章 " + pos + " / " + inCh.length;
    elTitle.textContent = s.title;
    elSay.innerHTML = s.say.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    elRefs.innerHTML = "<span>相关笔记</span>" + s.refs.map(function (r) { return '<a href="' + esc(href(r[1])) + '"' + (LOCAL ? "" : ' target="_blank" rel="noopener"') + ">" + esc(r[0]) + "</a>"; }).join("");
    elCounter.textContent = (i + 1) + " / " + STEPS.length;
    btnPrev.disabled = i === 0;
    btnNext.textContent = i === STEPS.length - 1 ? "从头再看" : "下一步 →";
    tickEls.forEach(function (t, k) { t.classList.toggle("cur", k === i); t.classList.toggle("seen", !!seen[k] && k !== i); });
    document.querySelectorAll(".chap").forEach(function (w) { w.classList.toggle("on", w.dataset.ch === s.ch); });
  }

  function go(i) {
    if (i < 0) i = 0;
    if (i >= STEPS.length) i = 0;
    seen[cur] = true; cur = i; seen[i] = true;
    render(i);
    try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) { /* 不支持时忽略 */ }
    try { localStorage.setItem("rhce-cka-tour-step", String(i)); } catch (e) { /* 存储不可用时忽略 */ }
    narrate();
  }

  /* ---------- 朗读与连播 ---------- */
  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  if (!synth) { btnTts.disabled = true; document.getElementById("tts-note").hidden = false; }
  function zhVoice() {
    if (!synth) return null;
    var vs = synth.getVoices() || [];
    return vs.filter(function (v) { return /^zh(-|_)?(CN|Hans)?/i.test(v.lang) && /CN|Hans|中文|普通话|Mandarin/i.test(v.lang + v.name); })[0] ||
           vs.filter(function (v) { return /^zh/i.test(v.lang); })[0] || null;
  }
  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function stopSpeech() { speakToken++; if (synth) synth.cancel(); elSay.querySelectorAll("p").forEach(function (p) { p.classList.remove("speaking"); }); }
  function afterNarration() { if (autoOn && cur < STEPS.length - 1) timer = setTimeout(function () { go(cur + 1); }, 900); }
  function narrate() {
    clearTimer(); stopSpeech();
    if (ttsOn && synth) {
      var token = speakToken, paras = elSay.querySelectorAll("p"), chunks = [];
      STEPS[cur].say.forEach(function (p, pi) {
        p.split(/(?<=[。！？])/).forEach(function (sent) { if (sent.trim()) chunks.push([sent, pi]); });
      });
      chunks.unshift([STEPS[cur].title + "。", -1]);
      var voice = zhVoice();
      chunks.forEach(function (ck, k) {
        var u = new SpeechSynthesisUtterance(ck[0].replace(/--/g, " ").replace(/\//g, " "));
        u.lang = "zh-CN"; u.rate = 1.05; if (voice) u.voice = voice;
        u.onstart = function () { if (token !== speakToken) return; paras.forEach(function (p, pi) { p.classList.toggle("speaking", pi === ck[1]); }); };
        if (k === chunks.length - 1) u.onend = function () { if (token !== speakToken) return; paras.forEach(function (p) { p.classList.remove("speaking"); }); afterNarration(); };
        synth.speak(u);
      });
    } else if (autoOn) {
      var len = STEPS[cur].say.join("").length;
      timer = setTimeout(function () { if (cur < STEPS.length - 1) go(cur + 1); }, Math.max(7000, len * 210));
    }
  }
  btnTts.addEventListener("click", function () {
    ttsOn = !ttsOn; btnTts.setAttribute("aria-pressed", String(ttsOn)); btnTts.textContent = ttsOn ? "朗读中" : "朗读";
    if (ttsOn) narrate(); else { stopSpeech(); clearTimer(); if (autoOn) narrate(); }
  });
  btnAuto.addEventListener("click", function () {
    autoOn = !autoOn; btnAuto.setAttribute("aria-pressed", String(autoOn));
    if (!autoOn) clearTimer(); else if (!ttsOn || (synth && !synth.speaking)) narrate();
  });
  btnPrev.addEventListener("click", function () { go(cur - 1); });
  btnNext.addEventListener("click", function () { go(cur + 1); });
  btnReplay.addEventListener("click", function () { stage.innerHTML = STEPS[cur].scene(); });
  var btnZoom = document.getElementById("zoom");
  btnZoom.addEventListener("click", function () {
    var on = !stage.classList.contains("zoom");
    stage.classList.toggle("zoom", on); btnZoom.setAttribute("aria-pressed", String(on)); btnZoom.textContent = on ? "适应屏幕" : "放大图解";
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  });
  if (synth && "onvoiceschanged" in synth) synth.onvoiceschanged = function () {};

  /* 起始步：链接里的 #s12 优先，其次是上次看到的位置 */
  var start = 0, m = /^#s(\d+)$/.exec(location.hash || "");
  if (m) start = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), STEPS.length - 1);
  else { try { var saved = parseInt(localStorage.getItem("rhce-cka-tour-step"), 10); if (saved >= 0 && saved < STEPS.length) start = saved; } catch (e) { /* 忽略 */ } }
  cur = start; seen[start] = true; render(start);
})();
</script>
</body>
</html>
